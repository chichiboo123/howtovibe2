<!DOCTYPE html>
<html lang="ko" data-theme="<?= theme ?>">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" />
<style>
:root{
  --ink:#171C26; --ink-2:#343C4A; --muted:#5E6675; --faint:#6A7180;
  --paper:#F6F7F9; --surface:#FFFFFF; --sunk:#EFF1F4; --line:#E3E6EB;
  --blue:#006DD2; --blue-tint:#EAF3FE; --seam:#C8312F; --seam-tint:#FDEDEE;
  --f1:#C8EDD9; --f1d:#1A6B47; --f2:#BFD9F2; --f2d:#1A5F8A;
  --r-xl:22px; --r-lg:16px; --r-md:12px;
}
[data-theme="dark"]{
  --ink:#ECEFF4; --ink-2:#C8CEDA; --muted:#A3ACBA; --faint:#8A93A3;
  --paper:#0D1017; --surface:#151A23; --sunk:#1B212C; --line:#262D3A;
  --blue:#5AA8F5; --blue-tint:#122437; --seam:#FF6B6F; --seam-tint:#2A1719;
  --f1:#173A2A; --f1d:#8FDDB4; --f2:#16304A; --f2d:#9CC8EE;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;}
body.embed{background:transparent;}
/* 연수 사이트가 높이를 맞춰 주면 안쪽 스크롤을 없애 한 페이지처럼 읽히게 합니다 */
html.fit,html.fit body{overflow:hidden;}
.material-icons-outlined{font-size:20px;vertical-align:middle;line-height:1;}
main{max-width:1100px;margin:0 auto;padding:24px 16px 28px;}
body.embed main{padding:4px 2px 12px;}
.top{margin-bottom:18px;}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em;}
.top p{color:var(--muted);margin-top:4px;}
body.embed .top{display:none;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px;}
.form-field{display:grid;gap:8px;}
.form-field + .form-field{margin-top:22px;}
.form label{display:block;font-weight:800;font-size:15px;}
textarea{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);
  font:inherit;font-size:14.5px;line-height:1.65;padding:12px 14px;}
textarea:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent);}
.form .help{font-size:13px;line-height:1.6;color:var(--muted);}
.form label small{font-size:13px;font-weight:500;color:var(--muted);}
input.app-url,input.author-input{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);font:inherit;font-size:14.5px;padding:12px 14px;}
.author{font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
.free-text{white-space:pre-wrap;font-size:15px;line-height:1.8;overflow-wrap:anywhere;}
.app-link{text-decoration:none;align-self:flex-start;color:var(--blue);}
.preview{font-size:13px;color:var(--ink-2);background:var(--sunk);border-radius:var(--r-md);padding:10px 12px;}
.preview b{color:var(--ink);}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;}
.row input{height:44px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);font:inherit;padding:0 12px;width:150px;}
.count{font-size:13px;color:var(--faint);margin-right:auto;}
.btn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border:none;border-radius:var(--r-md);cursor:pointer;
  font:inherit;font-weight:800;font-size:15px;background:var(--ink);color:var(--paper);}
.btn:disabled{opacity:.5;cursor:default;}
.btn-line{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:none;border-radius:10px;cursor:pointer;
  font:inherit;font-weight:700;font-size:13.5px;background:var(--surface);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);}
.note{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;}
.note .material-icons-outlined{font-size:17px;color:var(--seam);}
.msg{margin-top:8px;font-size:14px;font-weight:700;min-height:0;}
.msg.err{color:var(--seam);} .msg.ok{color:var(--f1d);}

.list-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px;}
.list-h b{font-size:17px;letter-spacing:-.02em;}
.list-h b span{color:var(--blue);}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));align-items:start;}
.list-more{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;}
.list-more[hidden],.list-more [hidden]{display:none;}
.list-more .btn-line{min-width:140px;justify-content:center;}
.list-progress{font-size:13px;color:var(--muted);}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.post:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
.post-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.post-h b{min-width:0;font-size:17.5px;font-weight:800;letter-spacing:-.03em;line-height:1.35;overflow-wrap:anywhere;}
.post-h time{flex-shrink:0;font-size:12.5px;color:var(--faint);}
.who{align-self:flex-start;font-size:12.5px;font-weight:800;color:var(--ink-2);background:var(--sunk);border-radius:999px;padding:3px 10px;}
.exp{background:var(--f1);border-radius:var(--r-md);padding:12px 14px;}
.k{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:2px;}
.exp .k{color:var(--f1d);}
.exp p{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.6;white-space:pre-line;}
.prob p{font-size:14px;color:var(--ink-2);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tags span{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--blue-tint);color:var(--blue);}
.tags span.dir{background:var(--f2);color:var(--f2d);}
details{border-top:1px dashed var(--line);padding-top:8px;}
summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--muted);list-style:none;}
summary::-webkit-details-marker{display:none;}
summary::before{content:'＋ ';}
details[open] summary::before{content:'－ ';}
details pre{margin-top:8px;white-space:pre-wrap;font:inherit;font-size:13.5px;line-height:1.7;color:var(--ink-2);background:var(--sunk);border-radius:var(--r-md);padding:10px 12px;}
.empty,.loading{color:var(--muted);font-size:14.5px;padding:18px 4px;}
/* 내 글: 수정 · 삭제 */
.post.mine{border-color:color-mix(in srgb,var(--blue) 45%,var(--line));}
.mine-tag{font-size:12px;font-weight:800;color:var(--blue);margin-right:auto;}
.own{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.own .btn-line{height:32px;font-size:13px;}
.own .danger{color:var(--seam);}
.own .ask{font-size:13px;font-weight:700;color:var(--seam);margin-right:2px;}
.edit textarea{min-height:200px;font-size:14px;}
.edit .msg{margin-top:6px;}
.edited{font-size:12px;color:var(--faint);}
</style>
</head>
<body class="<?= embed ? 'embed' : '' ?>">
<main id="main">
  <header class="top">
    <h1>우리의 앱 아이디어</h1>
    <p>기획서, 자유로운 이야기, 완성한 앱을 함께 나눠요.</p>
  </header>

  <section class="card form" aria-labelledby="rawLabel">
    <div class="form-field">
      <label for="author">작성자 <small>선택</small></label>
      <input class="author-input" id="author" type="text" maxlength="40" aria-describedby="authorHelp" />
      <p class="help" id="authorHelp">별명을 써도 됩니다. 비워 두면 익명으로 표시됩니다.</p>
    </div>
    <div class="form-field">
      <label id="rawLabel" for="raw">내용</label>
      <textarea id="raw" maxlength="3000" aria-describedby="rawHelp"></textarea>
      <p class="help" id="rawHelp">기획서를 붙여넣거나 자유롭게 작성할 수 있습니다.</p>
      <p class="preview" id="preview" hidden></p>
    </div>
    <div class="form-field">
      <label for="appUrl">앱 링크 <small>선택</small></label>
      <input class="app-url" id="appUrl" type="url" maxlength="2000" aria-describedby="urlHelp" />
      <p class="help" id="urlHelp">주소를 넣으면 ‘앱 열기’ 버튼이 표시됩니다.</p>
    </div>
    <div class="row">
      <span class="count" id="count">0 / 3000</span>
      <input id="code" type="password" placeholder="게시 코드" aria-label="게시 코드" autocomplete="off" hidden />
      <button class="btn" id="send" type="button">공유하기</button>
    </div>
    <p class="note"><span class="material-icons-outlined" aria-hidden="true">privacy_tip</span>학생 개인정보는 적지 마세요. 글은 공개되며, 수정·삭제는 작성한 브라우저에서 가능합니다.</p>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>

  <section aria-labelledby="listTitle">
    <div class="list-h">
      <b id="listTitle">공유된 아이디어 <span id="n">0</span></b>
      <button class="btn-line" id="reload" type="button"><span class="material-icons-outlined">refresh</span>새로고침</button>
    </div>
    <p class="loading" id="loading">불러오는 중…</p>
    <div class="cards" id="cards"></div>
    <div class="list-more" id="listMore" hidden>
      <span class="list-progress" id="listProgress" role="status" aria-live="polite"></span>
      <button class="btn-line" id="more" type="button" aria-controls="cards">더보기</button>
    </div>
    <p class="empty" id="empty" hidden>아직 공유된 아이디어가 없습니다. 첫 번째로 나눠 주세요.</p>
  </section>
</main>

<script>
var EMBED = <?!= JSON.stringify(!!embed) ?>;
var PARENT = <?!= JSON.stringify(parentOrigin || '') ?>;
var MAX = 3000;
var $ = function (id) { return document.getElementById(id); };
var LABELS = { '앱 이름': 'appName', '누가': 'who', '아쉬운 점': 'problem', '학생 경험': 'experience', '기능 블록': 'blocks', '넓어지는 쪽': 'directions' };

/* 서버의 parsePlan_ 과 같은 규칙: 붙여넣는 동안 무엇이 읽혔는지 미리 보여 줍니다 */
function parsePlan(raw) {
  var f = {}, key = null;
  raw.replace(/\r\n?/g, '\n').split('\n').forEach(function (line) {
    var m = line.match(/^\s*\[([^\]]{1,20})\]\s?(.*)$/);
    if (m) { key = LABELS[m[1].trim()] || null; if (key) f[key] = m[2].trim(); }
    else if (key && line.trim()) f[key] += (f[key] ? '\n' : '') + line.trim();
  });
  return f;
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // 글은 언제나 글자로만 넣습니다
  return e;
}
function when(iso) {
  var d = new Date(iso); if (isNaN(d)) return '';
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
}
function split(s, sep) { return String(s || '').split(sep).map(function (x) { return x.trim(); }).filter(Boolean); }
function webUrl(value) {
  var url = String(value == null ? '' : value).trim();
  if (!url) return '';
  if (url.length > 2000 || /[\s<>"'\\]/.test(url) || !/^https?:\/\/[^\s/?#@:\\]+(?::\d{1,5})?(?:[/?#][^\s\\]*)?$/i.test(url)) {
    throw new Error('앱 주소는 http:// 또는 https://로 시작하는 웹 주소를 2000자 이내로 넣어 주세요.');
  }
  return url;
}

/* ── 내 글 알아보기: 글을 올릴 때 받은 '수정 열쇠'를 이 브라우저에 보관합니다 ──
   게시판 안쪽 주소는 새로고침(강제 새로고침 포함) 때 바뀔 수 있어 이쪽 저장소만으로는 잊힙니다.
   그래서 연수 사이트 안에서는 열쇠를 연수 사이트(PARENT)에도 맡겨 두고, 다시 열 때 돌려받습니다. */
var KEYS_ID = 'vc-board-keys';
var parentKeys = {};
function localKeys() { try { return JSON.parse(localStorage.getItem(KEYS_ID) || '{}') || {}; } catch (e) { return {}; } }
function keys() {
  var all = localKeys();
  Object.keys(parentKeys).forEach(function (id) { if (!all[id]) all[id] = parentKeys[id]; });
  return all;
}
function setKey(id, k) {
  var all = localKeys(); if (k) all[id] = k; else delete all[id];
  if (k) parentKeys[id] = k; else delete parentKeys[id];
  try { localStorage.setItem(KEYS_ID, JSON.stringify(all)); } catch (e) {}
  if (EMBED && PARENT) { try { window.top.postMessage({ type: 'vc-board-key', id: id, key: k || null }, PARENT); } catch (e) {} }
}
function btn(text, cls) { var b = el('button', 'btn-line' + (cls ? ' ' + cls : ''), text); b.type = 'button'; return b; }

function card(p) {
  var key = keys()[p.id];
  var planned = p.kind ? p.kind === 'plan' : !!parsePlan(p.raw || '').appName;
  var c = el('article', 'post' + (key ? ' mine' : ''));
  c.tabIndex = -1;
  c.dataset.id = p.id;
  var h = el('div', 'post-h'); h.appendChild(el('b', '', planned ? (p.appName || '이름 없는 앱') : '자유 나눔'));
  var t = el('time', '', when(p.createdAt)); t.dateTime = p.createdAt; h.appendChild(t); c.appendChild(h);
  c.appendChild(el('span', 'author', '작성자: ' + (p.author || '익명')));
  if (planned) {
  if (p.who) c.appendChild(el('span', 'who', p.who));
  if (p.experience) { var x = el('div', 'exp'); x.appendChild(el('span', 'k', '학생이 경험할 배움')); x.appendChild(el('p', '', p.experience)); c.appendChild(x); }
  if (p.problem) { var pr = el('div', 'prob'); pr.appendChild(el('span', 'k', '교실의 문제상황')); pr.appendChild(el('p', '', p.problem)); c.appendChild(pr); }
  var tags = el('div', 'tags');
  split(p.blocks, '+').forEach(function (b) { tags.appendChild(el('span', '', b)); });
  split(p.directions, '·').forEach(function (d) { tags.appendChild(el('span', 'dir', d)); });
  if (tags.children.length) c.appendChild(tags);
  var det = el('details'); det.appendChild(el('summary', '', '기획 전체 보기')); det.appendChild(el('pre', '', p.raw)); c.appendChild(det);
  } else {
    c.appendChild(el('p', 'free-text', p.raw));
  }
  var appUrl = '';
  try { appUrl = webUrl(p.appUrl); } catch (err) {}
  if (appUrl) {
    var link = el('a', 'btn-line app-link', '앱 열기 ↗');
    link.href = appUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
    c.appendChild(link);
  }
  if (p.updatedAt) c.appendChild(el('span', 'edited', '수정됨 ' + when(p.updatedAt)));
  if (key) c.appendChild(ownBar(p, c, key));
  return c;
}

/* 연수 사이트가 돌려준 열쇠를 받아, 내 글 카드에 수정 · 삭제를 다시 붙입니다 */
function takeParentKeys(k) {
  if (!k || typeof k !== 'object') return;
  var next = {};
  Object.keys(k).forEach(function (id) { if (typeof k[id] === 'string' && /^[\w-]{16,100}$/.test(k[id])) next[id] = k[id]; });
  if (JSON.stringify(next) === JSON.stringify(parentKeys)) return;
  parentKeys = next;
  if (!document.querySelector('.edit')) paint(lastList);   // 수정 중일 때는 화면을 건드리지 않습니다
}

/* 내가 올린 글에만 보이는 수정 · 삭제 */
function ownBar(p, c, key) {
  var bar = el('div', 'own');
  bar.appendChild(el('span', 'mine-tag', '내가 올린 글'));
  var ed = btn('수정'), del = btn('삭제', 'danger');
  bar.appendChild(ed); bar.appendChild(del);
  ed.addEventListener('click', function () { editCard(p, c, key); });
  del.addEventListener('click', function () {
    /* iframe 안에서는 확인 창(confirm)이 막힐 수 있어, 카드 안에서 한 번 더 묻습니다 */
    bar.textContent = '';
    bar.appendChild(el('span', 'ask', '이 글을 삭제할까요?'));
    var yes = btn('삭제', 'danger'), no = btn('취소');
    bar.appendChild(yes); bar.appendChild(no);
    no.addEventListener('click', function () { c.replaceWith(card(p)); });
    yes.addEventListener('click', function () {
      yes.disabled = no.disabled = true; yes.textContent = '삭제하는 중…';
      google.script.run
        .withSuccessHandler(function () {
          setKey(p.id, null); lastList = lastList.filter(function (x) { return x.id !== p.id; }); c.remove();
          shown = Math.min(shown, lastList.length);
          while ($('cards').children.length < shown) $('cards').appendChild(card(lastList[$('cards').children.length]));
          syncList();
          say('글을 삭제했습니다.', 'ok');
        })
        .withFailureHandler(function (e) { c.replaceWith(card(p)); say(e && e.message || '삭제하지 못했습니다.', 'err'); })
        .deletePost(p.id, key);
    });
  });
  return bar;
}

/* 카드 자리에서 기획 원문을 고쳐 다시 저장합니다 */
function editCard(p, c, key) {
  var box = el('article', 'post mine edit');
  box.appendChild(el('b', '', '글 수정'));
  var ta = el('textarea'); ta.id = 'edit-raw-' + p.id; ta.value = p.raw; ta.maxLength = MAX;
  var rawLabel = el('label', '', '내용'); rawLabel.htmlFor = ta.id; box.appendChild(rawLabel); box.appendChild(ta);
  var authorInput = el('input', 'author-input'); authorInput.id = 'edit-author-' + p.id; authorInput.type = 'text'; authorInput.maxLength = 40; authorInput.value = p.author || '';
  var authorLabel = el('label', '', '작성자 (선택)'); authorLabel.htmlFor = authorInput.id; box.appendChild(authorLabel); box.appendChild(authorInput);
  var urlInput = el('input', 'app-url'); urlInput.id = 'edit-url-' + p.id; urlInput.type = 'url'; urlInput.maxLength = 2000; urlInput.value = p.appUrl || '';
  var linkLabel = el('label', '', '앱 링크 (선택)'); linkLabel.htmlFor = urlInput.id; box.appendChild(linkLabel); box.appendChild(urlInput);
  var m = el('p', 'msg'); m.setAttribute('role', 'status'); box.appendChild(m);
  var bar = el('div', 'own'), save = btn('저장'), cancel = btn('취소');
  bar.appendChild(save); bar.appendChild(cancel); box.appendChild(bar);
  c.replaceWith(box); ta.focus();
  cancel.addEventListener('click', function () { box.replaceWith(card(p)); });
  save.addEventListener('click', function () {
    var raw = ta.value.trim();
    if (!raw || raw.length > MAX) { m.textContent = '공유할 내용을 1~' + MAX + '자로 적어 주세요.'; m.className = 'msg err'; return; }
    var appUrl;
    try { appUrl = webUrl(urlInput.value); } catch (err) { m.textContent = err.message; m.className = 'msg err'; urlInput.focus(); return; }
    save.disabled = cancel.disabled = ta.disabled = urlInput.disabled = authorInput.disabled = true; m.textContent = '저장하는 중…'; m.className = 'msg';
    google.script.run
      .withSuccessHandler(function (np) {
        lastList = lastList.map(function (x) { return x.id === np.id ? np : x; });
        box.replaceWith(card(np)); say('수정했습니다.', 'ok');
      })
      .withFailureHandler(function (e) { save.disabled = cancel.disabled = ta.disabled = urlInput.disabled = authorInput.disabled = false; m.textContent = e && e.message || '저장하지 못했습니다.'; m.className = 'msg err'; })
      .updatePost(p.id, key, raw, appUrl, authorInput.value);
  });
}

var PAGE_SIZE = 6, shown = 0, lastList = [];
function syncList() {
  $('n').textContent = lastList.length;
  $('empty').hidden = lastList.length > 0;
  $('listMore').hidden = lastList.length <= PAGE_SIZE;
  $('more').hidden = shown >= lastList.length;
  $('listProgress').textContent = shown + ' / ' + lastList.length;
  $('listProgress').setAttribute('aria-label', '전체 ' + lastList.length + '개 중 ' + shown + '개 표시');
}
function paint(list, reset) {
  lastList = list;
  shown = Math.min(reset ? PAGE_SIZE : (shown || PAGE_SIZE), list.length);
  var box = $('cards'); box.textContent = '';
  list.slice(0, shown).forEach(function (p) { box.appendChild(card(p)); });
  syncList(); $('loading').hidden = true;
}
function showMore() {
  var firstNew = shown;
  var next = lastList.slice(shown, shown + PAGE_SIZE);
  if (!next.length) return;
  next.forEach(function (p) { $('cards').appendChild(card(p)); });
  shown += next.length; syncList();
  var target = $('cards').children[firstNew];
  target.focus({ preventScroll: true }); target.scrollIntoView({ block: 'nearest' });
}
function load() {
  $('loading').hidden = false; $('loading').textContent = '불러오는 중…';
  google.script.run
    .withSuccessHandler(function (list) { paint(list, true); })
    .withFailureHandler(function (e) { $('loading').hidden = false; $('loading').textContent = '목록을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요. (' + (e && e.message || e) + ')'; })
    .listPosts();
}

function say(text, kind) { var m = $('msg'); m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : ''); }
function update() {
  var raw = $('raw').value; $('count').textContent = raw.length + ' / ' + MAX;
  var f = parsePlan(raw), pv = $('preview');
  if (!raw.trim()) { pv.hidden = true; return; }
  pv.hidden = false; pv.textContent = '';
  if (f.appName) {
    pv.appendChild(document.createTextNode('기획서로 공유합니다: '));
    pv.appendChild(el('b', '', f.appName));
  } else {
    pv.textContent = '자유 글로 공유합니다.';
  }
}

var sending = false;
function send() {
  if (sending) return;                      // 두 번 눌러도 한 번만 올라가게
  var raw = $('raw').value.trim();
  if (!raw || raw.length > MAX) { say('공유할 내용을 1~' + MAX + '자로 적어 주세요.', 'err'); return; }
  var appUrl;
  try { appUrl = webUrl($('appUrl').value); } catch (err) { say(err.message, 'err'); $('appUrl').focus(); return; }
  sending = true; $('send').disabled = true; say('공유하는 중…');
  $('raw').disabled = $('appUrl').disabled = $('author').disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      sending = false; $('send').disabled = false;
      $('raw').disabled = $('appUrl').disabled = $('author').disabled = false;
      setKey(res.post.id, res.key);           // 이 브라우저에서 내 글을 수정·삭제할 수 있게
      $('raw').value = ''; $('appUrl').value = ''; $('author').value = ''; update(); say('공유했습니다. 이 브라우저에서는 내 글을 수정·삭제할 수 있어요.', 'ok');
      lastList = [res.post].concat(lastList);
      $('cards').insertBefore(card(res.post), $('cards').firstChild);
      shown++; syncList(); $('loading').hidden = true;
    })
    .withFailureHandler(function (e) { sending = false; $('send').disabled = false; $('raw').disabled = $('appUrl').disabled = $('author').disabled = false; say(e && e.message || '공유하지 못했습니다.', 'err'); })
    .addPost(raw, $('code').value, appUrl, $('author').value);
}

$('raw').addEventListener('input', update);
$('send').addEventListener('click', send);
$('reload').addEventListener('click', load);
$('more').addEventListener('click', showMore);
google.script.run.withSuccessHandler(function (c) { $('code').hidden = !c.codeRequired; }).getConfig();
load();

/* ── 연수 사이트에 넣었을 때: 내용 높이를 알려 iframe 높이를 맞춥니다 ──
   PARENT(연수 사이트 주소)로만 보냅니다. 보내는 것은 높이 숫자와, 이 브라우저에서 올린 글의 수정 열쇠뿐입니다. */
if (EMBED && PARENT) {
  var lastH = 0;
  var report = function () {
    var h = Math.ceil($('main').getBoundingClientRect().bottom + 8);
    if (Math.abs(h - lastH) < 2) return;
    lastH = h;
    try { window.top.postMessage({ type: 'vc-board-height', h: h }, PARENT); } catch (e) {}
  };
  if ('ResizeObserver' in window) new ResizeObserver(report).observe($('main'));
  window.addEventListener('load', report);
  report();
  window.addEventListener('message', function (e) {
    if (e.origin !== PARENT || !e.data || e.data.type !== 'vc-board-ack') return;
    document.documentElement.classList.add('fit');
    takeParentKeys(e.data.keys);
  });
}
</script>
